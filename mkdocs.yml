site_name: Docs Portfolio — Luís Guedes da Silva
site_description: Selected technical documentation samples (structured docs, API docs, diagrams, docs-as-code workflow).

nav:
  - Home: index.md
  - Start here: getting-started.md
  - Documentation approach:
      - Mental model: concepts/mental-model.md
      - Workflow diagram: concepts/workflow-diagram.md
      - Docs strategy: strategy/docs-strategy.md
  - How-to guides:
      - Build a simple workflow: how-to/create-workflow.md
  - API documentation:
      - API reference sample: reference/api.md
  - Troubleshooting:
      - Common issues: troubleshooting/common-issues.md

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      title: On this page
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
